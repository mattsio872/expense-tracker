<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Tells the browser how to read the text (so ₱ shows correctly) -->
  <meta charset="UTF-8">
  <!-- Makes the page fit phone screens instead of showing a zoomed-out desktop page -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Expense Tracker</h1>
    <!-- app.js will fill in the real total later -->
    <p>Total spent: <strong id="total">₱0.00</strong></p>
  </header>

  <main>
    <!-- 1. The form for adding (and later editing) an expense -->
    <section aria-labelledby="form-title">
      <h2 id="form-title">Add expense</h2>

      <form id="expense-form">
        <label for="amount">Amount (₱)</label>
        <input id="amount" name="amount" type="number" inputmode="decimal"
               min="0.01" step="0.01" placeholder="0.00" required>

        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Bills">Bills</option>
          <option value="Shopping">Shopping</option>
          <option value="Health">Health</option>
          <option value="Entertainment">Entertainment</option>
          <option value="School">School</option>
          <option value="Other">Other</option>
        </select>

        <label for="date">Date</label>
        <input id="date" name="date" type="date" required>

        <label for="note">Note</label>
        <input id="note" name="note" type="text" maxlength="80"
               placeholder="e.g. Lunch with classmates">

        <button type="submit" id="submit-btn">Add expense</button>
      </form>
    </section>

    <!-- 2. The list of saved expenses -->
    <section aria-labelledby="list-title">
      <h2 id="list-title">Expenses</h2>
      <p id="empty-message">No expenses yet. Add your first one above.</p>
      <ul id="expense-list"></ul>
    </section>
  </main>

  <!-- "defer" = run the script after the HTML above has loaded -->
  <script src="app.js" defer></script>
</body>
</html>
