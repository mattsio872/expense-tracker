<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Tells the browser how to read the text (so ₱ shows correctly) -->
  <meta charset="UTF-8">
  <!-- Makes the page fit phone screens instead of showing a zoomed-out desktop page.
       viewport-fit=cover lets the dark background run under the notch and home bar;
       style.css then pads the content back out with env(safe-area-inset-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The app is always dark ("After Hours"), so form controls and scrollbars are dark too -->
  <meta name="color-scheme" content="dark">
  <title>Matt's Expenses</title>

  <!-- PWA: the manifest tells phones this page can be installed as an app (name, icon, colors) -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Colors the phone's status bar / browser bar: the same as the page background -->
  <meta name="theme-color" content="#1b1411">

  <!-- Fonts: Outfit (everything) and Caveat Brush (the motto only). Offline, the phone's own
       font is used instead (see --font-sans in style.css), so the app still works. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Caveat+Brush&display=swap" rel="stylesheet">
  <!-- Browser tab icon (also stops the "favicon.ico not found" error) -->
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <!-- iPhones use these instead of the manifest's icons and name on the home screen -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <!-- "?v=6" is a version number. Browsers (and the service worker, sw.js) keep saved copies of
       style.css and app.js, so after changing either file, add 1 here, on the app.js link below,
       AND to VERSION in sw.js. The new number makes it a new address, so the new file is downloaded
       instead of mixing new HTML with old CSS/JS. -->
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <header class="app-header">
    <!-- alt="" marks the icon as decoration, so screen readers just read the title text.
         width/height reserve the space before the image loads, so the page doesn't jump. -->
    <h1 class="app-title">
      <img class="app-icon" src="images/monkey-icon.png" alt="" width="44" height="44">
      Matt's Expenses
    </h1>

    <!-- The Live badge: which month the whole screen shows. The real control is the <select>
         stretched invisibly over the badge, so tapping it opens the phone's own month picker.
         app.js fills in the months and the visible label ("Live: Nov" or "Oct 2026"). -->
    <div class="live-badge" id="live-badge">
      <span class="live-dot" aria-hidden="true"></span>
      <span class="live-label" id="live-label" aria-hidden="true">Live</span>
      <select id="filter-month" aria-label="Month"></select>
    </div>
  </header>

  <!-- One column, centred, on every screen size -->
  <main class="layout">
    <!-- The lightbox: the one glowing thing on the page, the chosen month's total.
         app.js fills in the total and the comparison with the month before. -->
    <section class="lightbox" aria-labelledby="total-label">
      <p class="lightbox-label" id="total-label">Spent this month</p>
      <p class="lightbox-total"><strong id="total">₱0</strong></p>
      <p class="lightbox-compare" id="total-compare" hidden></p>
    </section>

    <!-- The walnut speaker panel: the month's biggest categories as round "speaker cones".
         Tapping a cone shows only that category in the list. app.js builds the cones. -->
    <section class="speaker-panel" id="speaker-panel" aria-label="Spending by category" hidden>
      <div class="cones" id="cones"></div>
    </section>

    <!-- The expenses of the chosen month, grouped by day -->
    <section class="expenses" aria-labelledby="list-title">
      <h2 id="list-title" class="visually-hidden">Expenses</h2>

      <!-- "Showing Bills · Clear", only while a category is picked.
           aria-live="polite" makes screen readers announce it when it changes. -->
      <p id="filter-summary" class="filter-line" aria-live="polite">
        <span id="filter-text"></span>
        <button type="button" id="filter-clear" class="link-button" hidden>Clear</button>
      </p>

      <p id="empty-message" class="empty" hidden></p>
      <!-- One <li> per day: a day header, then that day's expenses -->
      <ul id="expense-list" class="expense-list"></ul>
    </section>

    <!-- 1. The form for adding (and editing) an expense. The floating Add expense button
         brings you here (in the next step it moves into a sheet that slides up). -->
    <section class="card" id="form-card" aria-labelledby="form-title">
      <h2 id="form-title">Add expense</h2>

      <form id="expense-form">
        <!-- Each label + input pair is wrapped in a "field" so they stay together -->
        <div class="field">
          <label for="amount">Amount</label>
          <div class="amount-input">
            <span class="currency" aria-hidden="true">₱</span>
            <input id="amount" name="amount" type="number" inputmode="decimal"
                   min="0.01" step="0.01" placeholder="0.00" required>
          </div>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Entertainment">Entertainment</option>
            <option value="School">School</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="date">Date</label>
          <input id="date" name="date" type="date" required>
        </div>

        <div class="field">
          <label for="note">Note <span class="optional">(optional)</span></label>
          <!-- maxlength stops typing at 200 characters; the counter below shows how many are left.
               aria-describedby makes screen readers read the counter along with the field. -->
          <input id="note" name="note" type="text" maxlength="200"
                 placeholder="e.g. Lunch with classmates" aria-describedby="note-count">
          <small id="note-count" class="hint">0 / 200</small>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Add expense</button>
          <!-- Only shown while editing. type="button" so it doesn't submit the form -->
          <button type="button" id="cancel-btn" class="btn" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <!-- 4. Backup: save all expenses to a CSV file (and, in the next step, load them back) -->
    <section class="card backup-card" aria-labelledby="backup-title">
      <h2 id="backup-title">Backup</h2>
      <p class="card-note">Save all your expenses as a CSV file (opens in Excel or Google Sheets), or load them back from one.</p>
      <!-- Which month to export. app.js fills in the months that have expenses. -->
      <div class="field export-month">
        <label for="export-month">Month to export</label>
        <select id="export-month">
          <option value="all">All months</option>
        </select>
      </div>
      <div class="backup-actions">
        <button type="button" id="export-btn" class="btn btn-primary">Export CSV</button>
        <button type="button" id="import-btn" class="btn">Import CSV</button>
        <!-- The real file picker is hidden; the Import button opens it. accept= limits it to CSV files -->
        <input type="file" id="import-file" accept=".csv,text/csv" hidden>
      </div>

      <!-- After picking a file: what was found, any problems, and what to do with it -->
      <div id="import-preview" class="import-preview" hidden>
        <p id="import-summary" class="import-summary"></p>
        <ul id="import-problems" class="import-problems"></ul>
        <div class="backup-actions">
          <button type="button" id="import-merge" class="btn btn-primary">Add new expenses</button>
          <button type="button" id="import-replace" class="btn btn-danger">Replace all</button>
          <button type="button" id="import-cancel" class="btn">Cancel</button>
        </div>
      </div>
      <!-- e.g. "Exported 4 expenses to expenses-2026-11-21.csv" -->
      <p id="backup-status" class="summary backup-status" aria-live="polite"></p>
    </section>
  </main>

  <!-- The hand-sprayed motto. aria-hidden: it's decoration, screen readers skip it -->
  <p class="motto" aria-hidden="true">focus on improving, not proving</p>

  <!-- Shows whether the app is saved for offline use, e.g. "✓ Ready to use offline" -->
  <footer class="app-footer">
    <p id="offline-status" class="offline-status" aria-live="polite"></p>
  </footer>

  <!-- The big glowing Add expense button, always in thumb reach at the bottom.
       The fade behind it lets the list slide under it instead of being cut off. -->
  <div class="add-fade" aria-hidden="true"></div>
  <button type="button" id="add-btn" class="glow-button add-button">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
      <path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    Add expense
  </button>

  <!-- "defer" = run the script after the HTML above has loaded -->
  <script src="app.js?v=6" defer></script>
</body>
</html>
